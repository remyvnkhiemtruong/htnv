server {
    listen 80;
    listen [::]:80;
    server_name htnv.io.vn www.htnv.io.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/htnv-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://htnv.io.vn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.htnv.io.vn;
    ssl_certificate /etc/letsencrypt/live/htnv-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/htnv-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/htnv-security.conf;
    return 308 https://htnv.io.vn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name htnv.io.vn;
    ssl_certificate /etc/letsencrypt/live/htnv-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/htnv-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HTNVSSL:10m;
    ssl_session_timeout 1d;
    root /srv/htnv/current/dist;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;
    include /etc/nginx/snippets/htnv-security.conf;
    access_log /var/log/nginx/htnv-domain-access.log;
    error_log /var/log/nginx/htnv-domain-error.log;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /api { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html {
        include /etc/nginx/snippets/htnv-security.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
